<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Costa Clara · Playas de Baleares</title>
  <desc id="og-desc">Mapa interactivo de las playas de Baleares: calidad del agua, servicios, bandera azul y rutas para cada cala y arenal.</desc>

  <defs>
    <linearGradient id="bg-sea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="55%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <radialGradient id="glow-top" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="map-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <clipPath id="map-clip">
      <rect x="704" y="84" width="416" height="462" rx="24" />
    </clipPath>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Fondo marino principal -->
  <rect width="1200" height="630" fill="url(#bg-sea)" />
  <rect width="1200" height="630" fill="url(#glow-top)" />

  <!-- Curvas batimétricas decorativas (baja opacidad, sin competir con el texto) -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M-40 520 C 180 470, 380 560, 640 500 C 860 450, 1020 540, 1240 490" />
    <path d="M-40 565 C 210 515, 420 605, 670 545 C 890 495, 1050 580, 1240 535" />
    <path d="M-40 110 C 190 70, 370 140, 620 85 C 840 35, 1030 100, 1240 60" />
  </g>

  <!-- ZONA SEGURA PRINCIPAL: x [80..1120], y [80..550] -->

  <!-- Columna izquierda: Marca, titular, subtítulo y pilares -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Isotipo + marca Costa Clara (idéntico al header de la app) -->
    <g transform="translate(80, 84)">
      <rect width="58" height="58" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />
      <g transform="translate(11, 11) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 16c2.2 0 2.2-2 4.4-2s2.2 2 4.4 2 2.2-2 4.4-2 2.2 2 4.4 2" />
        <path d="M3 20c2.2 0 2.2-2 4.4-2s2.2 2 4.4 2 2.2-2 4.4-2 2.2 2 4.4 2" />
        <path d="M12 4v7M9 7l3-3 3 3" />
      </g>

      <text x="74" y="29" fill="#ffffff" font-size="27" font-weight="700" letter-spacing="-0.02em">Costa Clara</text>
      <text x="74" y="51" fill="#bae6fd" font-size="16" font-weight="500" letter-spacing="0.02em">Observatorio de playas · Baleares</text>
    </g>

    <!-- Titular principal -->
    <text x="80" y="236" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-0.03em">Playas de Baleares</text>
    <text x="80" y="302" fill="#7dd3fc" font-size="56" font-weight="800" letter-spacing="-0.03em">en un solo mapa</text>

    <!-- Subtítulo -->
    <text x="80" y="362" fill="#e0f2fe" font-size="23" font-weight="400">
      <tspan x="80" dy="0">Calidad del agua, servicios, bandera azul</tspan>
      <tspan x="80" dy="33">y cómo llegar a cada cala y arenal.</tspan>
    </text>

    <!-- Píldoras de atributos clave -->
    <g transform="translate(80, 442)">
      <rect x="0" y="0" width="176" height="40" rx="20" fill="#082f49" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
      <circle cx="22" cy="20" r="5.5" fill="#10b981" />
      <text x="36" y="25" fill="#f8fafc" font-size="15.5" font-weight="600">Calidad del agua</text>

      <rect x="188" y="0" width="146" height="40" rx="20" fill="#082f49" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
      <circle cx="210" cy="20" r="5.5" fill="#38bdf8" />
      <text x="224" y="25" fill="#f8fafc" font-size="15.5" font-weight="600">Bandera azul</text>

      <rect x="346" y="0" width="172" height="40" rx="20" fill="#082f49" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
      <circle cx="368" cy="20" r="5.5" fill="#f59e0b" />
      <text x="382" y="25" fill="#f8fafc" font-size="15.5" font-weight="600">Mapa y servicios</text>
    </g>

    <!-- Pie discreto con dominio -->
    <text x="80" y="538" fill="#bae6fd" font-size="16" font-weight="600" letter-spacing="0.02em">Mallorca · Menorca · Ibiza · Formentera</text>
  </g>

  <!-- Columna derecha: Tarjeta cartográfica estilizada de Baleares -->
  <g filter="url(#card-shadow)">
    <rect x="704" y="84" width="416" height="462" rx="24" fill="url(#map-water)" />
  </g>

  <g clip-path="url(#map-clip)">
    <!-- Cuadrícula cartográfica sutil -->
    <g stroke="#0284c7" stroke-opacity="0.1" stroke-width="1">
      <line x1="704" y1="160" x2="1120" y2="160" />
      <line x1="704" y1="236" x2="1120" y2="236" />
      <line x1="704" y1="312" x2="1120" y2="312" />
      <line x1="704" y1="388" x2="1120" y2="388" />
      <line x1="704" y1="464" x2="1120" y2="464" />
      <line x1="787" y1="84" x2="787" y2="546" />
      <line x1="870" y1="84" x2="870" y2="546" />
      <line x1="953" y1="84" x2="953" y2="546" />
      <line x1="1036" y1="84" x2="1036" y2="546" />
    </g>

    <!-- Siluetas vectoriales esquemáticas de las Islas Baleares -->
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round">
      <!-- Ibiza (Eivissa) -->
      <path d="M742 356 L760 330 L788 322 L796 340 L786 364 L764 380 L744 374 Z" />
      <!-- Formentera -->
      <path d="M768 408 L786 402 L804 414 L794 424 L772 420 Z" />
      <!-- Mallorca -->
      <path d="M846 274 L882 224 L930 198 L964 204 L956 226 L986 238 L992 276 L962 326 L928 348 L904 334 L888 308 L852 304 Z" />
      <!-- Menorca -->
      <path d="M1018 190 L1052 174 L1090 184 L1098 206 L1076 224 L1032 220 L1014 206 Z" />
    </g>

    <!-- Etiquetas de islas en mapa -->
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155" letter-spacing="0.06em">
      <text x="891" y="280" text-anchor="middle">MALLORCA</text>
      <text x="1056" y="242" text-anchor="middle">MENORCA</text>
      <text x="768" y="314" text-anchor="middle">IBIZA</text>
      <text x="790" y="442" text-anchor="middle">FORMENTERA</text>
    </g>

    <!-- Marcadores de calidad de agua (paleta QUALITY_COLORS de beach.ts) -->
    <!-- Mallorca -->
    <circle cx="924" cy="342" r="9.5" fill="#0f9f6e" stroke="#ffffff" stroke-width="3" />
    <circle cx="958" cy="316" r="9" fill="#0f9f6e" stroke="#ffffff" stroke-width="3" />
    <circle cx="984" cy="264" r="9" fill="#65a30d" stroke="#ffffff" stroke-width="3" />
    <circle cx="884" cy="304" r="9" fill="#65a30d" stroke="#ffffff" stroke-width="3" />
    <circle cx="876" cy="236" r="8.5" fill="#d97706" stroke="#ffffff" stroke-width="3" />
    <circle cx="904" cy="212" r="8.5" fill="#0f9f6e" stroke="#ffffff" stroke-width="3" />

    <!-- Menorca -->
    <circle cx="1028" cy="216" r="9.5" fill="#0f9f6e" stroke="#ffffff" stroke-width="3" />
    <circle cx="1062" cy="220" r="8.5" fill="#65a30d" stroke="#ffffff" stroke-width="3" />
    <circle cx="1090" cy="206" r="8.5" fill="#d97706" stroke="#ffffff" stroke-width="3" />

    <!-- Ibiza y Formentera -->
    <circle cx="746" cy="356" r="9" fill="#0f9f6e" stroke="#ffffff" stroke-width="3" />
    <circle cx="782" cy="366" r="8.5" fill="#65a30d" stroke="#ffffff" stroke-width="3" />
    <circle cx="780" cy="404" r="9.5" fill="#0f9f6e" stroke="#ffffff" stroke-width="3" />

    <!-- Clúster estilizado representativo (sea-700 para contraste >5.9:1 con texto blanco) -->
    <g transform="translate(946, 250)">
      <circle cx="0" cy="0" r="22" fill="#0369a1" fill-opacity="0.22" />
      <circle cx="0" cy="0" r="16" fill="#0369a1" stroke="#ffffff" stroke-width="2.5" />
      <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700">19</text>
    </g>

    <!-- Tarjeta superior flotante: pill de vista -->
    <g transform="translate(724, 104)">
      <rect width="144" height="34" rx="12" fill="#ffffff" fill-opacity="0.96" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="18" cy="17" r="4.5" fill="#0f9f6e" />
      <text x="31" y="21.5" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700">Calidad del agua</text>
    </g>

    <!-- Leyenda inferior flotante dentro de la tarjeta mapa -->
    <g transform="translate(724, 474)">
      <rect width="376" height="52" rx="14" fill="#ffffff" fill-opacity="0.96" stroke="#e2e8f0" stroke-width="1" />
      <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">
        <circle cx="24" cy="26" r="5" fill="#0f9f6e" />
        <text x="36" y="30.5">Excelente</text>

        <circle cx="132" cy="26" r="5" fill="#65a30d" />
        <text x="144" y="30.5">Buena</text>

        <circle cx="216" cy="26" r="5" fill="#d97706" />
        <text x="228" y="30.5">Suficiente</text>

        <rect x="312" y="14" width="50" height="24" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="337" y="30" text-anchor="middle" fill="#0369a1" font-size="11.5" font-weight="700">Azul</text>
      </g>
    </g>
  </g>

  <!-- Borde nítido de la tarjeta mapa -->
  <rect x="704" y="84" width="416" height="462" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" />
</svg>
